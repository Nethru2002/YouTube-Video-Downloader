[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube_downloader"
version = "1.0.0"
description = "A production-grade YouTube video and audio downloader without FFmpeg dependencies."
readme = "README.md"
authors = [
    { name = "Developer", email = "developer@example.com" }
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    "yt-dlp>=2023.11.16",
    "tqdm>=4.65.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
yt-download = "youtube_downloader.main:main"

[tool.setuptools.packages.find]
include = ["youtube_downloader*"]